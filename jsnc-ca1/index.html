<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSNC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .box {
    /* position: relative; */
    margin-top: 25%;
}

.center-child {
    background-color: greenyellow;
    border: 1px solid gainsboro;
    width: 200px;
    /* height: 100px; */
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -100px 0 0 -100px;
    font-size: 50px;
    text-align: center;
    display: block;
    vertical-align: middle;
}
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center my-4">JSNC Update</h1>
      <div class="box">
        <div class="center-child" id="box">
            <p id="value"></p>
        </div>
    </div>
    </div>
    <script
      type="text/javascript"
      src="https://cdn.rawgit.com/alexgibson/shake.js/master/shake.js"
    ></script>

    <script type="text/javascript">
      window.onload = function() {
          var color = ['greenyellow', 'goldenrod', 'yellow', 'red', 'rebeccapurple', 'pink', 'white'];
          var i = 0;
          document.getElementById('value').innerHTML = i;
          var myShakeEvent = new Shake({
              threshold: 10
          });
          
          myShakeEvent.start();
          
          window.addEventListener('shake', shakeEventDidOccur, false);
          
          function shakeEventDidOccur () {
              i += 1;
              document.getElementById('value').innerHTML = i;
              document.getElementById('box').setAttribute("style", "background-color: "+color[i%7]+";");
          }
          
          function stopShake(){
              shakeEvent.stop();
          }

          if(!("ondevicemotion" in window)){alert("Not Supported");}
      };
      </script>
    </script>
  </body>
</html>
